[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-lidar-simulation-lab"
version = "0.1.0"
description = "Independent geometry-verified Blender camera and LiDAR research simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10", "opencv-python>=4.8", "open3d==0.19.0", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
simlab = "simulator.cli:main"

[tool.setuptools.packages.find]
include = ["simulator*"]

[tool.setuptools.package-data]
simulator = ["patterns/*.npz", "patterns/*.json", "patterns/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
