# Targetless camera + Livox Avia calibration (intrinsics + extrinsics) from the scene alone.
# Nothing about any calibration target is known or used: a checkerboard in the room is just
# more scene structure. Inputs are the Oct 29 stacked captures (read-only), so the result can
# be compared one to one with the Oct 29 checkerboard calibration (used ONLY for evaluation).
# Paths are relative to this folder.

oct29_dir: "../../Oct 29 test"            # stacked_data/<device>/*.npz (input), results/ (evaluation only)
output_dir: ../results
cache_dir: ../cache
stacked_dir: ../stacked_data              # new datasets decoded by decode_bags.py (one folder per dataset)

# ------------------------------------------------------------------ what is assumed known
prior:
  # Mounting only: camera optical axis = LiDAR +x, camera rolled 90 deg (camera x = -LiDAR z,
  # camera y = LiDAR y). Exact angles, translation and lens parameters are all estimated.
  # "auto" instead: camera looks along LiDAR +x, the four 90-degree rolls are all tried.
  rotation_lidar_to_camera: [[0, 0, -1], [0, 1, 0], [1, 0, 0]]
  translation_m: [0.0, 0.0, 0.0]
  principal_point_sigma_px: 3.0           # cx, cy pulled to the fisheye image-circle centre (the data override it when they disagree strongly)
  aspect_sigma: 0.05                      # fx / fy near 1 (weak)

# ------------------------------------------------------------------ decoding new datasets (decode_bags.py)
decode:
  # Still window found without any target: natural image corners (KLT) are tracked in every
  # frame against the all-frame median image; the window is the longest (max_s .. min_s) in
  # which 80 % of the corners stay within the tolerance of their window median, relaxed step by
  # step if needed. The rig is rigid, so camera stillness = LiDAR stillness.
  min_s: 1.0
  max_s: 5.0
  step_s: 0.5
  tolerance_px: [0.3, 0.45, 0.6, 1.0]
  feature_quantile: 0.8
  max_features: 400
  # LiDAR frames with many changed points (people walking through) are dropped
  lidar_bin_deg: 0.4
  lidar_change_abs_m: 0.10
  lidar_change_rel: 0.03
  robust_k: 6.0
  lidar_change_floor: 0.02

# ------------------------------------------------------------------ LiDAR edges (3D, LiDAR frame)
lidar:
  min_range_m: 1.5                        # Avia returns closer than ~1.5-2 m are smeared in range (saturation, range walk)
  max_range_m: 20.0
  bin_deg: 0.2                            # spherical grid of the stacked cloud (camera pixel ~0.25 deg)
  surface_tol_m: 0.05                     # points within this of the nearest return form a bin's surface
  # depth-jump edges (foreground side only), EdgeDenseCalib-style densification:
  jump_abs_m: 0.15
  jump_rel: 0.06
  jump_noise_k: 4.0                       # ... and at least this many times the local range noise
  empty_run_bins: 6                       # a jump into >= this many empty bins counts (no-return background)
  # plane-crease edges (depth-continuous, unaffected by beam divergence):
  plane_window: 9                         # bins per side of the plane-fit window (1.8 deg)
  plane_offset: 6                         # windows centred this many bins either side of the crease
  plane_rms_max_m: 0.015                  # off-plane rms of a "plane" window (Avia noise ~1-2 cm)
  crease_min_deg: 30.0
  # reflectivity edges (on smooth surfaces):
  intensity_canny: [30, 80]
  intensity_smooth_sigma: 0.8
  intensity_min_points_per_bin: 3.0       # reflectivity of sparsely hit (dark, grazing) surfaces is noise
  # cleaning:
  dynamic_tol_m: 0.05                     # first vs second half of the capture differ -> moving, dropped
  line_neighbours: 8
  line_linearity_min: 0.6
  max_points_per_type: 6000               # per capture, random subset (fixed seed)

# ------------------------------------------------------------------ image edges
image:
  smooth_sigma: 0.7
  canny: auto                             # thresholds from the image's gradient percentiles below
  canny_percentiles: [70, 85]             # = [20, 50] on the Oct 29 and creep images
  circle_shrink: 0.97

# ------------------------------------------------------------------ calibration
calib:
  coarse:
    focal_px: auto                        # from the image-circle radius (see half_fov_deg)
    half_fov_deg: [40, 85]                # fisheye half field of view at the circle edge
    focal_steps: 23                       # focal step = radius / focal_steps (~10 px)
    rotation_deg: [-4, 4, 1.0]              # a 1.5 deg step missed the best basin on pair_1
    translation_m: [-0.15, 0.15, 0.05]
    cap_px: 8.0
    points: 4000
    per_focal: 3                          # distinct rotation starts kept per focal length and score
    nid_points: 3000                      # NID proposals (per capture); 0 = chamfer proposals only
    min_separation_deg: 2.0
  gates_px: [12, 8, 5, 3, 2, 2]           # correspondence gate, shrinking (EdgeDenseCalib)
  release_gate_px: 5                      # above this gate only R, t, fx, fy are free (wide gates = many wrong matches)
  loss_scale_px: 1.0                      # Cauchy
  orientation_max_deg: 30.0               # projected 3D edge vs image edge direction
  weights: {depth: 1.0, crease: 1.0, intensity: 0.7}
  estimate_inflation: true                # Avia beam divergence (0.28 deg H) widens foreground edges
  hypothesis_gates_px: [12, 8, 5, 3, 2]   # quick refinement of every coarse hypothesis
  selection: {gate_px: 1.5, orientation_deg: 15.0, shift_px: 6.0}   # edge-alignment lift
  distortion_models: {k1: [k1], k1-k2: [k1, k2]}   # chosen by leave-one-capture-out lift
  loo_gates_px: [5, 3, 2]
  nid:
    # NID (Koide et al.) between Avia reflectivity and image intensity: computed and reported
    # for the final calibration, not optimised - refining with it made every device worse
    # (board check 0.5 -> 3 px on pair_4); the reflectivity / grey-level relation is too weak
    # at 484 x 366 px.
    bins: 16
    points_per_capture: 40000

seed: 0

# ------------------------------------------------------------------ self-check (reliable / check / unreliable)
confidence:
  min_lift: 1.5                 # edges must align clearly better than chance
  unreliable_lift: 1.3
  min_margin: 0.08              # over the best genuinely different solution
  max_loo_translation_mm: 30
  min_matches: 1000
