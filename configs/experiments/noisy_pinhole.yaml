scene: laboratory
lidar: velodyne_vlp16
camera: {model: pinhole, width: 640, height: 480, focal_px: 420, D: [-0.02, 0.001, 0.0, 0.0, 0.0]}
renderer: blender
render: {samples: 16, cubemap_size: 512, device: OPTIX}
duration: 0.1
captures: 1
